# Собирает неподписанное приложение для iPhone (.ipa) на бесплатном облачном Mac от GitHub
# и выкладывает его в раздел Releases — оттуда файл удобно скачать прямо на телефон.
# Запуск: вкладка Actions → «Сборка для iPhone» → Run workflow (или любой push в main).
name: Сборка для iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Генерация iOS-проекта
        run: npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods
        run: cd ios && pod install

      - name: Сборка (без подписи)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Planner.xcworkspace \
            -scheme Planner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Упаковка .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Planner.ipa Payload
          ls -lh Planner.ipa

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Planner-ipa
          path: Planner.ipa
          retention-days: 30

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Планер — сборка ${{ github.run_number }}
          body: |
            Скачай Planner.ipa на iPhone и открой его через SideStore (Поделиться → SideStore).
            Коммит: ${{ github.sha }}
          files: Planner.ipa
          make_latest: true
